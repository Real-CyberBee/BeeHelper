<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client 表单 · BeeHelper 本地验证</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fffdf6;color:#3a2a12;font:14px "PingFang SC",system-ui}header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:linear-gradient(180deg,#fffdf6,#fff8e6);border-bottom:1px solid #f0e3c4;gap:15px}header strong{font-size:18px;display:flex;align-items:center;gap:9px}header strong img{width:28px;height:28px}header span{font-size:12px;color:#a08d64}nav{display:flex;gap:24px;padding:20px 32px;border-bottom:1px solid #f0e3c4;background:#fffbee}nav a{color:#8a7752;text-decoration:none}nav a.active{color:#a86b00;font-weight:600;border-bottom:2px solid #f2ae2b;padding-bottom:2px}main{max-width:840px;margin:32px auto;padding:0 24px}h1{font-size:23px;margin:0 0 14px}h2{font-size:16px;font-weight:500;margin:20px 0}.status{padding:12px 0;color:#a3771a;font-size:12px;border-bottom:1px solid #f0e3c4;margin-bottom:22px}.steps{display:flex;gap:35px;padding:17px 0 25px;color:#b3a179;font-size:12px}.steps .active{color:#a86b00;font-weight:600}form{background:#fffdf6;border:1px solid #f0e3c4;padding:28px;border-radius:8px;box-shadow:0 8px 30px #8a5c000f}.fields{display:grid;grid-template-columns:1fr 1fr;gap:22px}label{display:flex;flex-direction:column;gap:9px;color:#8a7752;font-size:12px}input,select,textarea,button{font:inherit}input,select,textarea{padding:10px;border:1px solid #ead9b2;border-radius:5px;width:100%;color:#4a3305;background:#fff}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}button{padding:10px 18px;cursor:pointer;border:1px solid #ead9b2;border-radius:5px;background:#fff;color:#6d5730}button.primary{background:linear-gradient(180deg,#ffc94d,#f2ae2b);color:#33230a;border-color:#e0a01f;font-weight:600}.result{padding:18px 0;color:#a86b00;white-space:pre-wrap}.tag{color:#8a5c00;background:#fff2cc;border:1px solid #f2dfa6;font-size:11px;padding:4px 7px;border-radius:4px}pre{overflow-wrap:anywhere;white-space:pre-wrap;font-size:12px}@media(max-width:600px){header{padding:15px}nav{padding:18px 15px;gap:15px}main{padding:0 15px}.fields{grid-template-columns:1fr}form{padding:20px}.steps{gap:15px}}
  </style>
</head>
<body>
<header><strong><img src="/logo/bee-96.png" alt="">BeeHelper Lab</strong><span class="tag">本地测试数据</span></header>
<nav><a href="?view=tools">QA 测试工具</a><a href="?view=seller">Seller Center</a><a href="?view=client">Client 表单</a></nav>
<main id="main"></main>
<script>
const view = new URL(location.href).searchParams.get("view") || "client";
document.querySelector('nav a[href="?view=' + view + '"]')?.classList.add("active");
const main = document.querySelector("#main");
const getShop = () => JSON.parse(localStorage.getItem("beehelper.lab.shop") || "null");
const status = () => { const shop = getShop(); return shop ? "Shop " + shop.id + " · " + (shop.enrolled ? "已入驻" : "未入驻") : "尚未创建 Shop"; };
if (view === "tools") {
  main.innerHTML = '<h1>QA 测试工具</h1><div class="status">' + status() + '</div><form id="shop-form"><h2>创建 Shop</h2><div class="fields"><label>Shop 名称<input name="shop_name" required></label><label>地区<select name="region"><option value="SG">Singapore</option><option value="MY">Malaysia</option></select></label></div><div class="actions"><button class="primary">创建 Shop</button></div></form><div class="result" id="result"></div>';
  document.querySelector("#shop-form").onsubmit = event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const shop = { id: "SHOP-" + Date.now(), ...data, enrolled: false }; localStorage.setItem("beehelper.lab.shop", JSON.stringify(shop)); document.querySelector("#result").textContent = JSON.stringify(shop, null, 2); document.querySelector(".status").textContent = status(); };
} else if (view === "seller") {
  main.innerHTML = '<h1>Seller Center</h1><div class="status">' + status() + '</div><form id="enroll-form"><h2>Seller 入驻</h2><div class="fields"><label>Shop ID<input name="shop_id" required></label><label>联系邮箱<input name="seller_email" type="email" required></label></div><div class="actions"><button class="primary">确认入驻</button></div></form><div class="result" id="result"></div>';
  if (getShop()) document.querySelector('[name="shop_id"]').value = getShop().id;
  document.querySelector("#enroll-form").onsubmit = event => { event.preventDefault(); const shop = getShop(); if (!shop || shop.id !== new FormData(event.target).get("shop_id")) { document.querySelector("#result").textContent = "Shop 不存在"; return; } shop.enrolled = true; shop.email = new FormData(event.target).get("seller_email"); localStorage.setItem("beehelper.lab.shop", JSON.stringify(shop)); document.querySelector("#result").textContent = "入驻成功：" + shop.id; document.querySelector(".status").textContent = status(); };
} else {
  let step = 1; const values = {};
  const fields = [
    '<label>Client 名称<input name="client_name" required></label><label>联系邮箱<input name="email" type="email" required></label><label>联系电话<input name="phone" type="tel" required></label><label>地区<select name="region" required><option value="">请选择</option><option value="SG">Singapore</option><option value="MY">Malaysia</option><option value="PH">Philippines</option></select></label>',
    '<label>公司名称<input name="company_name" required></label><label>税务编号<input name="tax_number" required></label><label>账单地址<textarea name="billing_address" required></textarea></label><label>联系人<input name="contact_name" required></label>',
    '<label>仓库代码<input name="warehouse_code" required></label><label>预计日订单量<input name="daily_orders" type="number" min="1" required></label><label>Shop ID<input name="shop_id"></label><label>备注<textarea name="notes"></textarea></label>'
  ];
  function render() {
    main.innerHTML = '<h1>Client 表单</h1><div class="status">' + status() + '</div><div class="steps">' + ["基本信息","公司信息","业务配置"].map((label, index) => '<span class="' + (index + 1 === step ? "active" : "") + '">' + (index + 1) + ' · ' + label + '</span>').join("") + '</div><form id="client-form"><div class="fields">' + fields[step - 1] + '</div><div class="actions">' + (step > 1 ? '<button type="button" id="previous">上一步</button>' : "") + '<button class="primary">' + (step === 3 ? "提交 Client" : "下一步") + '</button></div></form><div class="result" id="result"></div>';
    for (const [key, value] of Object.entries(values)) { const input = document.querySelector('[name="' + key + '"]'); if (input) input.value = value; }
    const shop = getShop(); const shopInput = document.querySelector('[name="shop_id"]'); if (shop && shopInput && !shopInput.value) shopInput.value = shop.id;
    document.querySelector("#previous")?.addEventListener("click", () => { Object.assign(values, Object.fromEntries(new FormData(document.querySelector("form")))); step--; render(); });
    document.querySelector("#client-form").onsubmit = event => { event.preventDefault(); Object.assign(values, Object.fromEntries(new FormData(event.target))); if (step < 3) { step++; render(); } else { const clients = JSON.parse(localStorage.getItem("beehelper.lab.clients") || "[]"); clients.push({ ...values, id: "CLIENT-" + Date.now() }); localStorage.setItem("beehelper.lab.clients", JSON.stringify(clients)); document.querySelector("#result").textContent = "Client 已保存到本地测试环境\n" + JSON.stringify(clients.at(-1), null, 2); } };
  }
  render();
}
</script>
</body></html>
