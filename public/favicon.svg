<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".5" stop-color="#f0a92c"/>
      <stop offset="1" stop-color="#c87f14"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#9fe8f5" stop-opacity=".45"/>
    </linearGradient>
  </defs>

  <!-- 六边形蜂巢外框 -->
  <path d="M32 2.5 58 18.5 58 45.5 32 61.5 6 45.5 6 18.5Z" fill="#0c0c12" stroke="url(#gold)" stroke-width="3"/>
  <path d="M32 7.5 53 20.5 53 43.5 32 56.5 11 43.5 11 20.5Z" stroke="url(#gold)" stroke-width="1" opacity=".4"/>

  <!-- 翅膀 -->
  <ellipse cx="20.5" cy="25" rx="9.5" ry="5.5" transform="rotate(-38 20.5 25)" fill="url(#wing)"/>
  <ellipse cx="43.5" cy="25" rx="9.5" ry="5.5" transform="rotate(38 43.5 25)" fill="url(#wing)"/>

  <!-- 蜂身 + 条纹 -->
  <ellipse cx="32" cy="32" rx="7.5" ry="15" fill="url(#gold)"/>
  <rect x="25.8" y="25" width="12.4" height="2.8" rx="1.4" fill="#2a1a04" opacity=".8"/>
  <rect x="25.8" y="33" width="12.4" height="2.8" rx="1.4" fill="#2a1a04" opacity=".8"/>
  <rect x="25.8" y="41" width="12.4" height="2.8" rx="1.4" fill="#2a1a04" opacity=".8"/>

  <!-- 头 + 触角 -->
  <circle cx="32" cy="12" r="4.8" fill="url(#gold)"/>
  <path d="M29.6 8.6 26.2 4.2" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M34.4 8.6 37.8 4.2" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="26.2" cy="4.2" r="1.2" fill="url(#gold)"/>
  <circle cx="37.8" cy="4.2" r="1.2" fill="url(#gold)"/>

  <!-- 尾针 -->
  <path d="M32 47.5 34.8 53.5 29.2 53.5Z" fill="#c87f14"/>

  <!-- 赛博数据节点 -->
  <circle cx="50" cy="16" r="2" fill="#31d0e8"/>
  <circle cx="50" cy="16" r="4" stroke="#31d0e8" opacity=".35" stroke-width="1"/>
</svg>
